<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
        svg: { fontCache: 'global' }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/chemistry/ap-chemistry/' | relative_url }}">Chemistry</a>
          <a href="{{ '/chemistry/chemical-foundations-journey/' | relative_url }}">Foundations</a>
          <a href="{{ '/physics/time-and-space/' | relative_url }}">Physics</a>
        </nav>
      </div>
    </header>

    <main class="container content">
      <article>
        {% if page.title %}<p class="breadcrumb"><a href="{{ '/' | relative_url }}">{{ site.title }}</a> / {{ page.title }}</p>{% endif %}
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">{{ site.title }} · Markdown learning notes</div>
    </footer>
  </body>
</html>
